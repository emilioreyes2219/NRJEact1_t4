<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Empleado</title>
</head>
<body>
    <h1>Registro de Nuevo Empleado</h1>
    
    <form action="#" th:action="@{/guardar}" th:object="${empleado}" method="post">
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" />
        </div>
        <br>
        <div>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" th:field="*{apellido}" />
        </div>
        <br>
        <div>
            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" th:field="*{direccion}" />
        </div>
        <br>
        <div>
            <label for="puesto">Puesto:</label>
            <input type="text" id="puesto" th:field="*{puesto}" />
        </div>
        <br>
        <div>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" th:field="*{edad}" />
        </div>
        <br>
        <div>
            <label for="telefono">Teléfono:</label>
            <input type="number" id="telefono" th:field="*{telefono}" />
        </div>
        <br>
        <div>
            <label for="id">ID:</label>
            <input type="number" id="id" th:field="*{id}" />
        </div>
        <br>
        <button type="submit">Enviar Datos</button>
    </form>
</body>
</html>
